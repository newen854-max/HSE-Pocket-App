name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # PYTHON
      # =========================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # LINUX DEPENDENCIES
      # =========================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      # =========================================================
      # BUILDZER
      # =========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install "buildozer==1.6.0"

          pip install "cython==0.29.34"

      # =========================================================
      # ENVIRONMENT
      # =========================================================

      - name: Configure Android build environment
        run: |
          echo "PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE=0" >> "$GITHUB_ENV"
          echo "BUILDOZER_WARN_ON_ROOT=0" >> "$GITHUB_ENV"

      # =========================================================
      # VERIFY CONFIGURATION
      # =========================================================

      - name: Verify configuration
        run: |
          echo "========================================"
          echo "Python"
          python --version

          echo "========================================"
          echo "Java"
          java -version

          echo "========================================"
          echo "Buildozer"
          buildozer --version

          echo "========================================"
          echo "Buildozer Android configuration"
          grep -E "^(requirements|android\.api|android\.minapi|android\.ndk|android\.archs|android\.accept_sdk_license|p4a\.)" buildozer.spec

      # =========================================================
      # COMPLETELY CLEAN PREVIOUS BUILD
      # =========================================================

      - name: Clean Buildozer environment
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      # =========================================================
      # IF BUILD FAILS, SHOW REAL ERROR
      # =========================================================

      - name: Show build failure details
        if: failure()
        run: |
          echo ""
          echo "======================================================"
          echo "SEARCHING FOR REAL BUILD ERROR"
          echo "======================================================"

          grep -n -E \
            "ERROR:|Error:|error:|Exception:|Traceback|Build failed|Command failed|FAILED|Failed" \
            build.log \
            | tail -n 100 || true

          echo ""
          echo "======================================================"
          echo "LAST 250 LINES"
          echo "======================================================"

          tail -n 250 build.log || true

      # =========================================================
      # CHECK APK
      # =========================================================

      - name: Check APK
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          ls -lah bin/

          find bin -type f -name "*.apk" -print

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hse-management-debug-apk
          path: bin/*.apk
          if-no-files-found: error